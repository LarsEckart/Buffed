name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Package addon
        shell: python
        run: |
          import os
          import re
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          version = os.environ["VERSION"]
          toc, count = re.subn(
              r"(?m)^## Version:[^\r\n]*",
              f"## Version: {version}",
              Path("Buffed.toc").read_text(),
          )
          if count != 1:
              raise SystemExit("Expected exactly one Version field in Buffed.toc")
          Path("dist").mkdir(exist_ok=True)
          with ZipFile(f"dist/Buffed-v{version}.zip", "w", ZIP_DEFLATED) as archive:
              archive.writestr("Buffed/Buffed.toc", toc)
              for name in ("Buffed.lua", "README.md"):
                  archive.write(name, f"Buffed/{name}")

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: gh release create "v$VERSION" "dist/Buffed-v$VERSION.zip" --target "$RELEASE_COMMIT" --title "Buffed v$VERSION" --generate-notes
